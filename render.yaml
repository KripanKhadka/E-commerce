services:
  - type: web
    name: hamro-sports
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn sportshop.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ESEWA_ENV
        value: test
      - key: ESEWA_PRODUCT_CODE
        value: EPAYTEST
      - key: ESEWA_SECRET_KEY
        value: "8gBm/:&EnhH.1/q"
      - key: SHOP_NAME
        value: "Hamro Sports"
      - key: SITE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
    databases:
      - name: hamro-sports-db
        plan: free

databases:
  - name: hamro-sports-db
    plan: free
