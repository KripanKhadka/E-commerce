{% extends "base.html" %}
{% block title %}Refund Request | Hamro Sports{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card-clean p-4 p-lg-5 mx-auto" style="max-width:700px">
    <span class="eyebrow dark">CUSTOMER CARE</span><h1 class="mt-2">Request a refund.</h1><p class="text-muted">Tell us what went wrong. Our team can review the request from the admin panel.</p>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Email</label>{{ form.email }}</div>
      <div class="mb-3"><label class="form-label">Reason</label>{{ form.reason }}</div>
      <button class="btn btn-danger rounded-pill px-4">Submit request</button>
    </form>
  </div>
</div>
{% endblock %}
